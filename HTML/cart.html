<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Heaven And Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/cart.css">
</head>
<body>
    <!-- Toolbar -->
    
    
    <div class="search-container">
        <div class="logo">
            <h1>Heaven And Home </h1>
            <p>Style That Speaks Comfort</p>
        </div>
        
        <div class="action-buttons">
            <a href="login.html" class="login-button">Log In</a>
            <a href="signup.html" class="signup-button">Sign Up</a>
            <a href="cart.html" class="cart-button">Cart</a>            
        </div>
    </div>
    <!-- Header -->
    <header>
        <div class="header-content">

            <nav>
                <ul class="nav-links">
                      <li><a href="Home.html">Home</a></li>
                      <li><a href="bedroom.html">Bedrooms</a></li>
                      <li><a href="living.html">Living Room</a></li>
                      <li><a href="kitchen.html">Kitchen</a></li>
                      <li><a href="dining.html">Dining Room</a></li>
                      <li><a href="Home.html#about-section">About</a></li>
                      <li><a href="Home.html#contact-section">Contact</a></li>
                </ul>
                <div class="menu-toggle">☰</div> <!-- Hamburger Menu -->
            </nav>
        </div>
    </header>

    <!-- Shopping Cart Section -->
    <div class="cart-container">
        <div class="cart-left">
            <div class="cart-item">
                <img src="../Images/logo.jpg" alt="Mont Blanc Table">
                <div class="item-details">
                    <h3>MONT BLANC</h3>
                    <div class="quantity">
                        Quantity: <input type="number" value="1" min="1">
                    </div>
                    <div class="price">EGP15,261.75</div>
                </div>
                <div class="trash-icon">🗑️</div>
            </div>
            <a href="home.html" class="continue-shopping">← Continue Shopping</a>
        </div>
        <div class="cart-right">
            <div class="cart-summary">
                <p>Items: 1</p>
                <p class="total-price">Total: EGP15,261.75</p>
            </div>
            <button id="checkout-btn"class="checkout-btn">PROCEED TO CHECKOUT</button>
        </div>
    </div>
    
    <script>
        document.getElementById("checkout-btn").addEventListener("click", function () {
          window.location.href = "checkout.html";
        });
      </script>
    <footer>
        <p>&copy; 2025 Heaven And Home. All rights reserved.</p>
    </footer>
</body>
</html>
