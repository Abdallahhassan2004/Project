<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Management</title>
    <link rel="stylesheet" href="../../CSS/users.css">
    <script src="../../JavaScript/admin.js" defer></script>
    <script>
        function exportUsers() {
            alert("Exporting Users...");
            // Add logic to export users
        }

        function filterUsers() {
            const searchValue = document.getElementById("userSearch").value.toLowerCase();
            const rows = document.querySelectorAll("tbody tr");
            rows.forEach(row => {
                const userName = row.querySelector("td:nth-child(2)").textContent.toLowerCase();
                const userEmail = row.querySelector("td:nth-child(3)").textContent.toLowerCase();
                row.style.display = userName.includes(searchValue) || userEmail.includes(searchValue) ? "" : "none";
            });
        }

        function editUser(button) {
            alert("Edit User");
            // Add logic to edit the user
        }

        function deleteUser(button) {
            if (confirm("Are you sure you want to delete this user?")) {
                const row = button.closest("tr");
                row.remove();
            }
        }
    </script>
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
        <nav>
            <ul>
                <li><a href="../admin.html">Dashboard</a></li>
                <li><a href="../admin/users.html" class="active">Users</a></li>
                <li><a href="../admin/products.html">Products</a></li>
                <li><a href="../admin/orders.html">Orders</a></li>
                <li><a href="../admin/settings.html">Settings</a></li>
                
            </ul>
        </nav>
    </header>
    <main>
        <h2>User Management</h2>
        <section id="users">
            
            <div class="actions">
                <button onclick="exportUsers()">Export Users</button>
                <input type="text" id="userSearch" placeholder="Search Users..." oninput="filterUsers()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Date Registered</th>
                        <th>Last Edited</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>John Doe</td>
                        <td>john.doe@example.com</td>
                        <td>2025-04-15</td>
                        <td>2025-05-12 16:45</td>
                        <td>
                            <button onclick="editUser(this)">Edit</button>
                            <button onclick="deleteUser(this)">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Jane Smith</td>
                        <td>jane.smith@example.com</td>
                        <td>2025-03-20</td>
                        <td>2025-05-10 14:30</td>
                        <td>
                            <button onclick="editUser(this)">Edit</button>
                            <button onclick="deleteUser(this)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Admin Panel</p>
    </footer>
</body>
</html>
