<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Product Management</title>
    <link rel="stylesheet" href="../../CSS/users.css">
    <script src="../../JavaScript/products.js" defer></script>
    <script src="../JavaScript/admin.js" defer></script>
    
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
        <nav>
            <ul>
                <li><a href="../admin.html">Dashboard</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="../admin/orders.html">Orders</a></li>
                <li><a href="../admin/products.html" class="active">Products</a></li>
                <li><a href="settings.html">Settings</a></li>
                
            </ul>
        </nav>
    </header>
    <main>
        
        <section id="products">
            <h2>Product History</h2>
            <div class="actions">
                <button onclick="openAddProductModal()">Add New Product</button>
                <button onclick="exportProducts()">Export Products</button>
                <input type="text" id="productSearch" placeholder="Search Products..." oninput="filterProducts()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Date Added</th>
                        <th>Last Edited</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Traditional Dining Set</td>
                        <td>Dining</td>
                        <td>£1,499</td>
                        <td>2025-05-01</td>
                        <td>2025-05-10 14:30</td>
                        <td>
                            <button onclick="editProduct(this)">Edit</button>
                            <button onclick="deleteProduct(this)">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Modern Sofa</td>
                        <td>Living Room</td>
                        <td>£899</td>
                        <td>2025-04-15</td>
                        <td>2025-05-05 10:00</td>
                        <td>
                            <button onclick="editProduct(this)">Edit</button>
                            <button onclick="deleteProduct(this)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Admin Panel</p>
    </footer>
</body>
</html>
