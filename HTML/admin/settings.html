<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../CSS/settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome -->
    <title>Admin Settings</title>
    <script>
        function goToAdminPage() {
            window.location.href = "../admin.html"; // Redirect to the admin page
        }

        function logoutAndRedirect() {
            alert('Logging out...');
            window.location.href = "../../Home.html"; // Redirect to the home page
        }

        function removeDevice(adminId) {
            alert(`Device for Admin ID ${adminId} removed successfully.`);
            // Add logic to remove the device (e.g., API call or DOM manipulation)
        }
    </script>
</head>
<body>
    

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Admin Panel</h2>
        </div>
        <nav class="sidebar-nav">
            <ul> 
                <li><a href="../admin.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="#settings"><i class="fas fa-cogs"></i> Settings</a></li>
                <li><a href="#" onclick="logoutAndRedirect()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>
    </div>

    <main>
        <!-- Settings Section -->
        <section id="settings">
            <h2>Settings</h2>

            <!-- Account Management -->
            <div class="settings-account">
                <h3>Account Management</h3>
                <form id="updateAccountForm">
                    <label for="adminName">Name:</label>
                    <input type="text" id="adminName" name="adminName" value="Admin Name" required>
                    
                    <label for="adminEmail">Email:</label>
                    <input type="email" id="adminEmail" name="adminEmail" value="admin@example.com" required>
                    
                    <label for="currentPassword">Current Password:</label>
                    <input type="password" id="currentPassword" name="currentPassword" required>
                    
                    <label for="newPassword">New Password:</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                    
                    <button type="submit">Update Account</button>
                </form>
            </div>

            <!-- Admin Login Tracking -->
            <div class="settings-logins">
                <h3>Admin Login History</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Admin Name</th>
                            <th>Email</th>
                            <th>Login Time</th>
                            <th>Device</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Admin 1</td>
                            <td>admin1@example.com</td>
                            <td>2025-05-15 10:00 AM</td>
                            <td>Chrome on Windows</td>
                            <td>
                                <button onclick="removeDevice(1)">Remove Device</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Admin 2</td>
                            <td>admin2@example.com</td>
                            <td>2025-05-15 11:30 AM</td>
                            <td>Safari on Mac</td>
                            <td>
                                <button onclick="removeDevice(2)">Remove Device</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
